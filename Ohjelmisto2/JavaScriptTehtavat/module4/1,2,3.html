<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <form>
        <input id="query" name="q" type="text">
        <input type="submit" value="Search">
    </form>
    <div id = "target"></div>
<script>
'use strict';

document.addEventListener('submit', async function (event) {
    event.preventDefault();

    const query = document.querySelector('#query').value;

    try {
        const response = await fetch(`https://api.tvmaze.com/search/shows?q=${query}`);
        if (!response.ok) {
            throw new Error('HTTP error ' + response.status);
        }
        const data = await response.json();
        console.log(data);

        const target = document.getElementById("target");
        target.innerHTML = "";

        for (let i = 0; i < data.length; i++){
          const list = target.appendChild(document.createElement('li'));
          const name = list.appendChild(document.createElement('h2'));
          name.appendChild(document.createTextNode(data[i].show.name));
          const url = list.appendChild(document.createElement('a'));
          url.appendChild(document.createTextNode("link to details"));
          url.href = data[i].show._links.self.href;
          url.target = "_blank";
          const image = list.appendChild(document.createElement('img'));
          image.src = data[i].show.image?.medium;
          const summaryElement = list.appendChild(document.createElement('div'));
          summaryElement.innerHTML += data[i].show.summary;
        }

    } catch (error) {
        console.log('ERROR:', error.message);

    }
});

</script>
</body>
</html>
