<!DOCTYPE html>
<html lang="en">
<body>
<ul id="target"></ul>
<script>
    'use strict';
    let number = 1
    let numbers = []
    while(parseInt(number) != 0){
        number = prompt("Enter a number (0 to stop)")
        if (parseInt(number) != 0){
            numbers.push(parseInt(number))
        }
    }
    numbers.sort();
    numbers.reverse();
    console.log("numbers are: " + numbers);
</script>
</body>
</html>
